<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>NEGUS PERFUMES | Luxury in Every Scent</title>
<style>
:root{--gold:#d5b15b;--cream:#f5e9c7;--muted:#c5b991;--black:#090909}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#292216 0%,#11100d 38%,#070707 78%);color:#f7f0df;font-family:Georgia,'Times New Roman',serif;display:grid;place-items:center;padding:24px}
.card{width:min(100%,460px);border:1px solid #b99342;border-radius:24px;padding:30px 24px 26px;text-align:center;background:linear-gradient(145deg,rgba(30,27,20,.98),rgba(5,5,5,.98));box-shadow:0 18px 60px #0009, inset 0 0 0 5px #d5b15b12;position:relative;overflow:hidden}
.card:before,.card:after{content:"";position:absolute;width:150px;height:150px;border:1px solid #d5b15b35;transform:rotate(45deg);pointer-events:none}
.card:before{top:-110px;left:-95px}.card:after{bottom:-110px;right:-95px}
.seal{width:108px;height:108px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;color:var(--gold);font-size:55px;text-shadow:0 0 18px #d5b15b55;box-shadow:0 0 0 5px #d5b15b18,0 0 28px #d5b15b22}
h1{font-size:clamp(27px,7vw,36px);letter-spacing:3px;color:var(--gold);margin:0}
.tag{font-family:Arial,sans-serif;font-size:11px;letter-spacing:3px;color:var(--cream);margin:10px 0 22px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:20px 0}
.intro{font-family:Arial,sans-serif;color:var(--muted);font-size:14px;line-height:1.6;margin:0 auto 20px;max-width:310px}
.links{display:grid;gap:11px}
a.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:51px;border:1px solid #a98742;border-radius:12px;color:#f8edcf;text-decoration:none;font-family:Arial,sans-serif;font-weight:600;letter-spacing:.4px;background:linear-gradient(100deg,#211b10,#111);transition:transform .15s,background .15s}
a.btn:active{transform:scale(.985)}
.icon{color:var(--gold);font-size:18px}
.phone{background:linear-gradient(100deg,#4b3917,#1b160c)!important}
.small{font:11px Arial,sans-serif;color:#a99b76;letter-spacing:1.5px;margin-top:22px}
footer{font:10px Arial,sans-serif;color:#8d805f;margin-top:12px;letter-spacing:1px}
</style>
</head>
<body>
<main class="card">
  <div class="seal" aria-label="N monogram">N</div>
  <h1>NEGUS PERFUMES</h1>
  <div class="tag">LUXURY IN EVERY SCENT</div>
  <div class="rule"></div>
  <p class="intro">Discover your signature scent. Connect with us and explore our collection.</p>
  <nav class="links" aria-label="Contact and social links">
    <a class="btn" href="https://www.tiktok.com/@negus_perfumes" target="_blank" rel="noopener"><span class="icon">♪</span> TikTok · @negus_perfumes</a>
    <a class="btn" href="https://www.instagram.com/negusperfumes" target="_blank" rel="noopener"><span class="icon">◎</span> Instagram · @negusperfumes</a>
    <a class="btn" href="https://t.me/negusperfume" target="_blank" rel="noopener"><span class="icon">➤</span> Telegram · @negusperfume</a>
    <a class="btn phone" href="tel:+251958195459"><span class="icon">☎</span> Call · 095 819 5459</a>
    <a class="btn" href="https://wa.me/251958195459" target="_blank" rel="noopener"><span class="icon">✆</span> WhatsApp</a>
  </nav>
  <div class="rule"></div>
  <div class="small">THE BEST IN THE WEST</div>
  <footer>THANK YOU FOR CHOOSING NEGUS PERFUMES</footer>
</main>
</body>
</html>
